<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="team4019.png" type="image/" href="images/team4019.png">
  <title>Team | Mechanical Paradise</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />



  <style>
    :root {
      --palm: #2ec4b6;
      --deep: #0077b6;
      --sand: #ffe8b6;
      --dark: #023047;
    }

    body {
      margin: 0;
      font-family: Montserrat, sans-serif;
      background: linear-gradient(to bottom, #00b4d8, var(--sand));
      color: var(--dark);
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 2rem;
      background: white;
      padding: 1rem;
    }

    nav a {
      text-decoration: none;
      font-weight: bold;
      color: var(--deep);
    }

    section {
      max-width: 1100px;
      margin: 3rem auto;
      padding: 2rem;
      background: rgba(255,255,255,0.9);
      border-radius: 16px;
    }

    .team-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .member {
      text-align: center;
      background: white;
      padding: 1rem;
      border-radius: 14px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    }

    .member img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 12px;
      border: 4px solid var(--palm);
    }

    .member-name {
      margin-top: 0.75rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="team.html">Team</a>
  <a href="events.html">Events</a>
</nav>

<section>
  <h2>Team Members</h2>
  <p>The people who make Mechanical Paradise possible.</p>

  <div id="teamGrid" class="team-grid"></div>
</section>

<script>
  // === EDIT THIS ARRAY ===
  const teamMembers = [
    { name: "Tyler Peck", image: "images/People/tyler.png" },
    { name: "Cameron Lee", image: "images/People/Cameron.png" },
    { name: "RJ Hermes", image: "images/People/Rj.png" },
    { name: "Miles Merritt", image: "images/People/Miles.png" },
    { name: "Wyatt Cohen", image: "images/People/Wyatt.png" },
    { name: "Nehe Pierre-Louis", image: "images/People/Nehe.png" }
  ];

  const grid = document.getElementById("teamGrid");

  teamMembers.forEach(m => {
    const div = document.createElement("div");
    div.className = "member";
    div.innerHTML = `
      <img src="${m.image}" alt="${m.name}">
      <div class="member-name">${m.name}</div>
    `;
    grid.appendChild(div);
  });
</script>

</body>
</html>
